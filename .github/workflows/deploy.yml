name: deploy to cloudflare workers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # === Original repo: fetch secrets from Vault ===
      - name: "[Vault] Import cloudflare secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/cloudflare *

      - name: "[Vault] Import runtime secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/blog *

      # === Fork repos: use repository secrets ===
      - name: "[Fork] Import secrets from repository"
        if: github.repository != 'du2333/flare-stack-blog'
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "D1_DATABASE_ID=${{ secrets.D1_DATABASE_ID }}" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=${{ secrets.KV_NAMESPACE_ID }}" >> $GITHUB_ENV
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> $GITHUB_ENV
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_PURGE_API_TOKEN=${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}" >> $GITHUB_ENV
          echo "DOMAIN=${{ secrets.DOMAIN }}" >> $GITHUB_ENV
          echo "CDN_DOMAIN=${{ secrets.CDN_DOMAIN }}" >> $GITHUB_ENV
          echo "UMAMI_SRC=${{ secrets.UMAMI_SRC }}" >> $GITHUB_ENV
          echo "VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}" >> $GITHUB_ENV
          echo "PAGEVIEW_SALT=${{ secrets.PAGEVIEW_SALT }}" >> $GITHUB_ENV
          echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}" >> $GITHUB_ENV
          echo "THEME=${{ vars.THEME }}" >> $GITHUB_ENV
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> $GITHUB_ENV

      - name: Validate required secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID BUCKET_NAME DOMAIN; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            exit 1
          fi
          echo "Required secrets OK."

      - name: Inject Resource IDs
        run: |
          ROUTE="${ROUTE:-${{ vars.ROUTE }}}"
          ZONE_NAME="${ZONE_NAME:-${{ vars.ZONE_NAME }}}"
          export ROUTE
          export ZONE_NAME
          bun run wrangler:prepare

      # 只把非空的 secret 写入 Worker，避免未配置的可选项把线上已有值覆盖成空。
      - name: Generate Secrets JSON
        run: |
          cat <<EOF > secrets.raw.json
          {
            "BETTER_AUTH_SECRET": "$BETTER_AUTH_SECRET",
            "BETTER_AUTH_URL": "$BETTER_AUTH_URL",
            "ADMIN_EMAIL": "$ADMIN_EMAIL",
            "GITHUB_CLIENT_ID": "$GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET": "$GITHUB_CLIENT_SECRET",
            "CLOUDFLARE_ZONE_ID": "$CLOUDFLARE_ZONE_ID",
            "CLOUDFLARE_PURGE_API_TOKEN": "$CLOUDFLARE_PURGE_API_TOKEN",
            "DOMAIN": "$DOMAIN",
            "CDN_DOMAIN": "$CDN_DOMAIN",
            "VITE_UMAMI_WEBSITE_ID": "$VITE_UMAMI_WEBSITE_ID",
            "UMAMI_SRC": "$UMAMI_SRC",
            "PAGEVIEW_SALT": "$PAGEVIEW_SALT",
            "TURNSTILE_SECRET_KEY": "$TURNSTILE_SECRET_KEY",
            "GITHUB_TOKEN": "$GITHUB_TOKEN"
          }
          EOF
          jq 'with_entries(select(.value != ""))' secrets.raw.json > secrets.json
          echo "Secrets that will be updated:"
          jq -r 'keys[]' secrets.json

      - name: Deploy to Cloudflare Workers
        run: |
          if jq -e 'length > 0' secrets.json > /dev/null; then
            bunx wrangler secret bulk secrets.json
          else
            echo "No non-empty secrets to update, skipping secret bulk."
          fi
          bun run build
          bun run deploy

      # 非阻断：没有 Cache Purge 权限或未配置 token 时只打印状态，不影响部署结果。
      - name: Purge Cloudflare CDN Cache
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_PURGE_API_TOKEN" ]; then
            echo "skip purge: CLOUDFLARE_ZONE_ID / CLOUDFLARE_PURGE_API_TOKEN not configured"
            exit 0
          fi
          HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true)"
          echo "purge_cache http status: ${HTTP_CODE:-unknown} (non-fatal)"
          exit 0
