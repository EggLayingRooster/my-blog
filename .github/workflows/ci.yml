name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # 必须在用 example 覆盖 wrangler.jsonc 之前执行：
      # 校验已提交配置与 example 的 binding 一致，并且 worker-configuration.d.ts 同步。
      - name: Verify Wrangler Config
        run: bun run wrangler:verify

      - name: Verify Route Manifest
        run: |
          bun scripts/generate-manifest.ts
          git diff --exit-code -- src/lib/hono/path-manifest.generated.ts

      - name: Setup Wrangler Config
        run: cp wrangler.example.jsonc wrangler.jsonc

      - name: Lint Check
        run: bun lint

      - name: Compile Paraglide Runtime
        run: bun run i18n:compile

      - name: Verify Translations
        run: bun run i18n:verify

      - name: Type Check
        run: bun tsc --noEmit

      - name: Check Migration Drift
        run: |
          bun run db:generate
          git diff --exit-code -- migrations

      - name: Run Node Tests
        run: bun run test:node

      - name: Run Integration Tests
        run: bun run test

      - name: Production Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
